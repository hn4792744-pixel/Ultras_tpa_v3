# Layout file. Item name/lore come from the active language file (gui.<gui>.<item>.*).
# Add "name:" and/or "lore:" (MiniMessage) under any item to override them for every language.
# Every item also supports: material, slot, amount, glow, custom-model-data, enchants: {sharpness: 1}

# Toggle items: 'on' / 'off' sub-sections override material and glow per state.
rows: 4
filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE

items:
  receive-all:
    slot: 10
    material: NETHER_STAR
    on: { glow: true }
    off: { material: GRAY_DYE }
  receive-tpa:
    slot: 11
    material: ENDER_PEARL
    on: { glow: true }
    off: { material: GRAY_DYE }
  receive-tpahere:
    slot: 12
    material: ENDER_EYE
    on: { glow: true }
    off: { material: GRAY_DYE }
  sounds:
    slot: 13
    material: NOTE_BLOCK
    on: { glow: true }
    off: { material: GRAY_DYE }
  auto-open:
    slot: 14
    material: CHEST
    on: { glow: true }
    off: { material: GRAY_DYE }
  show-info:
    slot: 15
    material: PLAYER_HEAD
    on: { glow: true }
    off: { material: GRAY_DYE }
  actionbar:
    slot: 16
    material: OAK_SIGN
    on: { glow: true }
    off: { material: GRAY_DYE }
  auto-accept:
    slot: 24
    material: LIME_DYE
    on: { glow: true }
    off: { material: GRAY_DYE }
  language:
    slot: 20
    material: BOOK
  block-players:
    slot: 22
    material: IRON_BARS
  close:
    slot: 31
    material: BARRIER
